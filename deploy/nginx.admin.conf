server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;

        # ---- 客户端地址传递（与审计问题 1 配套） ----
        # 关键：这里用 $remote_addr **覆盖**而不是 $proxy_add_x_forwarded_for 追加。
        # 追加会把客户端自带的伪造 X-Forwarded-For 保留在链里，虽然服务端
        # 会从右往左剥离可信代理，但如果本机是边缘代理，直接覆盖最干净。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端必须把本机地址加入 CLS_TRUSTED_PROXIES，否则它不会采信
        # 上面这两个头，所有用户会被算成同一个 IP（限流误伤）。
        # docker-compose 场景示例：CLS_TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8
    }

    # 若本 Nginx 前面还有一层可信代理（云 LB / CDN），用 real_ip 模块
    # 先把真实地址还原到 $remote_addr，再传给后端：
    #
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;
}
