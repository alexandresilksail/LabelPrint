# CodeLabel Studio 服务端编排
# 注意：server/ 下的 FastAPI 实现将在阶段 4 填充；此文件先固定基础设施形态。
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codelabel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: codelabel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./server
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  admin:
    image: nginx:alpine
    volumes:
      - ./admin/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
